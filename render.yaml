services:
  - type: web
    name: terrashield-ai
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NODE_VERSION
        value: 20
      - key: DATA_MODE
        value: HISTORICAL_SAMPLE
      - key: NASA_FIRMS_MAP_KEY
        sync: false
      - key: TINYFISH_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: CORS_ORIGINS
        value: "http://localhost:5173,https://terrashield-ai.onrender.com,https://terrashield-ai-backend.onrender.com"
